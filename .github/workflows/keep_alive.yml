name: Mantener Backend Render Activo 24/7

on:
  schedule:
    # Se ejecuta cada 10 minutos para evitar que Render se suspenda (se suspende a los 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al Health Check de VectorIA en Render
        run: |
          echo "Enviando ping a la API de VectorIA..."
          curl -f -m 25 https://vectoria-xvs1.onrender.com/health || echo "La API tardó en responder o está despertando."

